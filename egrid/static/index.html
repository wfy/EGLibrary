<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EGLibrary — 电网矢量模型库</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; height: 100vh; background: #f4f6f8; color: #222;
  }
  /* ---------- 左栏 ---------- */
  #sidebar {
    width: 360px; min-width: 360px; background: #fff;
    border-right: 1px solid #e0e4e8; display: flex; flex-direction: column;
  }
  #sidebar header { padding: 12px 14px 10px; border-bottom: 1px solid #eef1f4; }
  #sidebar header h1 { font-size: 16px; margin-bottom: 8px; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  button {
    padding: 5px 10px; border: 1px solid #c8ceda; border-radius: 4px;
    background: #fafbfc; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #eef2ff; border-color: #7a8cd8; }
  button.primary { background: #2b5fd9; color: #fff; border-color: #2b5fd9; }
  button.primary:hover { background: #2450bd; }
  button.danger { color: #c0392b; }
  button.danger:hover { background: #fdecea; border-color: #c0392b; }
  button.active { background: #e8eeff; border-color: #2b5fd9; color: #2b5fd9; }
  #search { width: 100%; padding: 6px 9px; border: 1px solid #c8ceda; border-radius: 4px; font-size: 12px; }
  .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 10px; }
  @media (max-width: 720px) { .filters { grid-template-columns: 1fr; } }

  /* ---------- 自定义下拉（选项列表内含添加/删除操作） ---------- */
  .dd { position: relative; }
  .dd-trigger {
    width: 100%; padding: 4px 8px; border: 1px solid #c8ceda; border-radius: 4px;
    font-size: 11px; background: #fff; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
    overflow: hidden;
  }
  .dd-trigger span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-trigger::after { content: "▾"; color: #889; margin-left: 4px; flex-shrink: 0; }
  .dd-panel {
    position: absolute; top: calc(100% + 2px); left: 0; right: 0;
    background: #fff; border: 1px solid #c8ceda; border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,.16); z-index: 60;
    display: none; max-height: 260px; overflow-y: auto; min-width: 160px;
  }
  .dd.open .dd-panel { display: block; }
  .dd-opt { display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .dd-opt:hover { background: #f0f4ff; }
  .dd-opt.active { background: #e8eeff; color: #2b5fd9; }
  .dd-check { width: 12px; color: #2b5fd9; font-weight: bold; flex-shrink: 0; }
  .dd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-actions { display: flex; border-top: 1px solid #eef1f4; position: sticky; bottom: 0; background: #fff; }
  .dd-actions button {
    flex: 1; border: none; background: #fff; padding: 6px 4px;
    font-size: 11px; cursor: pointer; color: #2b5fd9;
  }
  .dd-actions button:hover { background: #f5f7ff; }
  .dd-actions button:disabled { color: #bbb; cursor: default; background: #fff; }
  .dd-actions button + button { border-left: 1px solid #eef1f4; }
  #model-list { flex: 1; overflow-y: auto; list-style: none; min-height: 90px; border-bottom: 1px solid #e0e4e8; }
  #model-list li {
    padding: 6px 14px; cursor: pointer; border-bottom: 1px solid #f0f2f5; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #model-list li:hover { background: #f5f7ff; }
  #model-list li.active { background: #e8eeff; border-left: 3px solid #2b5fd9; padding-left: 11px; }
  #model-list .m-code { color: #999; font-size: 11px; margin-left: 4px; }
  .src-badge {
    display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px;
    font-size: 10px; background: #e8f4ec; color: #2e7d4f; border: 1px solid #bfe0cc;
    vertical-align: middle;
  }
  .src-badge.gim { background: #e8eeff; color: #2b5fd9; border-color: #c3d2f5; }
  #cat-list li.sub { padding-left: 22px; color: #667; }
  .stl-list { display: flex; flex-direction: column; gap: 2px; }
  .stl-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; border: 1px solid #e3e7ec; border-radius: 4px;
    font-size: 11px; cursor: pointer; word-break: break-all;
  }
  .stl-item:hover { background: #f0f4ff; border-color: #7a8cd8; }
  .stl-item.active { background: #fff6d9; border-color: #d9a900; color: #8a6d00; }
  .stl-item .stl-faces { color: #99a; font-size: 10px; margin-left: 6px; white-space: nowrap; }
  #list-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 14px; border-top: 1px solid #eef1f4;
  }
  #list-count { font-size: 11px; color: #999; padding: 2px 0; }
  .pager { display: flex; align-items: center; gap: 6px; }
  .pager button { padding: 1px 8px; font-size: 12px; }
  .pager button:disabled { opacity: .35; cursor: default; }
  #pg-info { font-size: 11px; color: #777; min-width: 34px; text-align: center; }

  /* ---------- 信息栏（含操作区） ---------- */
  #info-panel { height: 52%; overflow-y: auto; padding: 10px 14px 14px; background: #fbfcfd; }
  #info-panel .placeholder { color: #aab; font-size: 12px; text-align: center; margin-top: 30px; }
  #info-panel h4 { font-size: 12px; color: #33415c; margin: 10px 0 6px; }
  #info-name { font-size: 14px; font-weight: bold; word-break: break-all; }
  #info-sub { font-size: 11px; color: #777; margin: 3px 0 8px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 11px; }
  .meta-grid b { color: #889; font-weight: normal; }
  .meta-grid .wide { grid-column: 1 / -1; }
  details.attr-group { margin-bottom: 4px; font-size: 11px; }
  details.attr-group summary { cursor: pointer; color: #2b5fd9; padding: 3px 0; user-select: none; }
  details.attr-group summary .cnt { color: #999; font-size: 10px; }
  table.attrs { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.attrs td { border-bottom: 1px solid #eef1f4; padding: 3px 4px; vertical-align: top; }
  table.attrs td.k { color: #667; width: 45%; }
  table.attrs td.v { word-break: break-all; }
  .op-box { border-top: 1px solid #e5e9ef; margin-top: 12px; padding-top: 10px; }
  .op-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .op-row input.note { flex: 1; min-width: 100px; padding: 5px 8px; border: 1px solid #c8ceda; border-radius: 4px; font-size: 11px; }
  ul.versions { list-style: none; font-size: 11px; }
  ul.versions li { padding: 3px 0; border-bottom: 1px dashed #eef1f4; }
  ul.versions .v-time { color: #999; font-size: 10px; margin-left: 6px; }

  /* ---------- 右侧主区域 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; padding: 14px 20px 16px; min-width: 0; }
  .placeholder { color: #aab; text-align: center; margin-top: 18vh; font-size: 15px; }
  #detail { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #detail.show { display: flex; }

  /* TAB */
  .tabs { display: flex; gap: 4px; margin-bottom: -1px; }
  .tab-btn {
    padding: 8px 22px; border: 1px solid #d5dae2; border-bottom: none;
    border-radius: 6px 6px 0 0; background: #eceff3; cursor: pointer; font-size: 13px; color: #556;
  }
  .tab-btn.active { background: #fff; color: #2b5fd9; font-weight: bold; border-color: #c8ceda; }
  .tab-body { flex: 1; background: #fff; border: 1px solid #d5dae2; border-radius: 0 6px 6px 6px; padding: 12px 14px; display: none; flex-direction: column; min-height: 0; }
  .tab-body.active { display: flex; }
  .tab-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab-head .title { font-size: 13px; color: #33415c; font-weight: bold; }
  .hint { font-size: 11px; color: #99a; margin-left: auto; }
  #pc-count { width: 92px; padding: 3px 8px; border: 1px solid #c8ceda; border-radius: 4px; font-size: 12px; }
  .meta-grid select, .meta-grid input {
    width: 100%; padding: 3px 6px; border: 1px solid #c8ceda; border-radius: 4px;
    font-size: 11px; background: #fff; color: #222;
  }

  canvas.view3d { flex: 1; width: 100%; border: 1px solid #eee; border-radius: 4px; background: #10141c; cursor: grab; display: block; min-height: 0; }
  canvas.view3d:active { cursor: grabbing; }

  /* ---------- 弹窗 ---------- */
  dialog {
    border: 1px solid #d5dae2; border-radius: 8px; padding: 20px 22px;
    width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,.15);
  }
  dialog::backdrop { background: rgba(30,40,60,.35); }
  dialog h3 { margin-bottom: 14px; font-size: 15px; }
  dialog label { display: block; font-size: 12px; color: #667; margin: 10px 0 4px; }
  dialog input, dialog select, dialog textarea {
    width: 100%; padding: 7px 9px; border: 1px solid #c8ceda; border-radius: 4px; font-size: 13px;
  }
  dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  #toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 8px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: .92; }

  /* ---------- 导入遮罩（菊花 + 计时） ---------- */
  #import-mask {
    position: fixed; inset: 0; background: rgba(20,28,40,.45);
    display: none; z-index: 98; align-items: center; justify-content: center;
  }
  #import-mask.show { display: flex; }
  .loading-box {
    background: #fff; border-radius: 10px; padding: 26px 36px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .spinner {
    width: 38px; height: 38px; border: 4px solid #e3e8f0; border-top-color: #2b5fd9;
    border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #load-text { font-size: 13px; color: #33415c; }
  #load-sub { font-size: 11px; color: #99a; margin-top: 5px; }
</style>
</head>
<body>

<!-- 左栏：工具栏 + 列表 + 信息栏(属性/操作/版本) -->
<aside id="sidebar">
  <header>
    <h1>⚡ EGLibrary 模型库</h1>
    <div class="toolbar">
      <button class="primary" id="btn-new">＋ 新建</button>
      <button id="btn-import">⇪ 导入 GIM/ZIP</button>
      <button id="btn-cats" title="管理模型大类">分类</button>
      <input type="file" id="import-file" accept=".zip,.gim" hidden>
    </div>
    <input id="search" placeholder="搜索名称 / 编码 / 描述，回车查询">
  </header>
  <div class="filters">
    <div id="dd-domain" class="dd"></div>
    <div id="dd-etype" class="dd"></div>
    <div id="dd-voltage" class="dd"></div>
  </div>
  <ul id="model-list"></ul>
  <div id="list-bar">
    <div id="list-count"></div>
    <div class="pager">
      <button id="pg-prev">‹</button>
      <span id="pg-info">1/1</span>
      <button id="pg-next">›</button>
    </div>
  </div>
  <div id="info-panel">
    <p class="placeholder">选中模型后此处显示属性与操作</p>
  </div>
</aside>

<!-- 右侧主区域：TAB（三维预览 / 点云展示） -->
<main id="main">
  <p class="placeholder" id="placeholder">← 从左侧选择一个模型</p>
  <div id="detail">
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-wire">三维预览</button>
      <button class="tab-btn" data-tab="tab-pc">点云展示</button>
    </div>

    <div class="tab-body active" id="tab-wire">
      <div class="tab-head">
        <span class="title">模型线架 · 实时三维</span>
        <button class="view-btn active" data-view="iso">等轴测</button>
        <button class="view-btn" data-view="front">正视</button>
        <button class="view-btn" data-view="side">侧视</button>
        <button class="view-btn" data-view="top">俯视</button>
        <button id="btn-wire-reset">重置</button>
        <span class="hint">拖拽旋转 · 右键/Shift拖拽平移 · 滚轮缩放 · 点击左侧 STL 部件高亮</span>
      </div>
      <canvas id="wire-canvas" class="view3d"></canvas>
    </div>

    <div class="tab-body" id="tab-pc">
      <div class="tab-head">
        <span class="title">点云三维展示</span>
        <input id="pc-count" type="number" min="1" max="100000" value="10000" title="采样点数（1-100000）">
        <button class="primary" id="btn-pointcloud">采样</button>
        <button id="btn-pc-reset">重置视角</button>
        <span class="hint">自定义点数 · 用于模型预训练 · 拖拽旋转 · 滚轮缩放</span>
      </div>
      <canvas id="pointcloud-canvas" class="view3d"></canvas>
    </div>
  </div>
</main>

<!-- 新建弹窗 -->
<dialog id="dlg-new">
  <h3>新建模型</h3>
  <label>名称 *</label>
  <input id="n-name" placeholder="如：220kV 隔离开关">
  <label>大类 *</label>
  <select id="n-category"></select>
  <label>编码</label>
  <input id="n-code" placeholder="如：GW4-220">
  <label>类型</label>
  <select id="n-type">
    <option value="device">设备</option><option value="material">材料</option>
    <option value="civil">构筑物</option><option value="system">系统</option>
    <option value="line">线路</option><option value="other">其他</option>
  </select>
  <label>电压等级</label>
  <input id="n-voltage" placeholder="如：220kV">
  <label>描述</label>
  <textarea id="n-desc" rows="2"></textarea>
  <div class="dialog-actions">
    <button id="n-cancel">取消</button>
    <button class="primary" id="n-submit">创建</button>
  </div>
</dialog>

<!-- 分类管理弹窗：电力领域 × 设备类型（双维度平级） -->
<dialog id="dlg-cats">
  <h3>分类管理</h3>
  <label>电力领域</label>
  <ul class="versions" id="cat-list"></ul>
  <div class="toolbar">
    <input id="c-name" placeholder="新增领域，如：直流" style="flex:1">
    <button class="primary" id="c-add">添加</button>
  </div>
  <label>设备类型</label>
  <ul class="versions" id="et-list"></ul>
  <div class="toolbar">
    <input id="et-name" placeholder="新增设备类型，如：避雷器" style="flex:1">
    <button class="primary" id="et-add">添加</button>
  </div>
  <div class="dialog-actions">
    <button id="c-close">关闭</button>
  </div>
</dialog>

<div id="toast"></div>

<!-- 导入遮罩 -->
<div id="import-mask">
  <div class="loading-box">
    <div class="spinner"></div>
    <div id="load-text">正在导入模型包…</div>
    <div id="load-sub"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let currentId = null;
let currentModel = null;

const TYPE_LABELS = { device: "设备", material: "材料", civil: "构筑物", system: "系统", line: "线路", other: "其他" };
const STAGE_LABELS = { common: "通用库", product: "产品库", finished: "成品库", custom: "自定义" };
const SOURCE_LABELS = { manual: "手工", gim: "GIM 导入", zip: "ZIP 载体" };
const CATEGORY_LABELS = {
  design: "设计参数", design_frozen: "设计冻结参数", product: "产品参数",
  construction: "施工参数", test: "测试参数", operation: "运检参数",
};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, options) {
  const resp = await fetch(path, options);
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) { /* 忽略解析失败 */ }
    throw new Error(detail);
  }
  return resp;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- 通用 3D 轨道控制器（z-up，拖拽旋转 / 右键或Shift平移 / 滚轮缩放） ----------
const ISO_PITCH = Math.asin(1 / Math.sqrt(3));   // 经典等轴测俯角 ≈35.26°
const DEFAULT_VIEW = { yaw: Math.PI / 4, pitch: ISO_PITCH };

function makeOrbit(canvas) {
  const st = { ...DEFAULT_VIEW, scale: 1.0, panX: 0, panY: 0 };
  let dragging = false, panning = false, lastX = 0, lastY = 0;
  const handle = {
    state: st,
    reset() { Object.assign(st, DEFAULT_VIEW, { scale: 1.0, panX: 0, panY: 0 }); },
    setView(name) {
      if (name === "front") Object.assign(st, { yaw: 0, pitch: 0 });
      else if (name === "side") Object.assign(st, { yaw: -Math.PI / 2, pitch: 0 });
      else if (name === "top") Object.assign(st, { yaw: 0, pitch: Math.PI / 2 });
      else Object.assign(st, DEFAULT_VIEW);
    },
    project(x, y, z) {
      // 标准轨道相机：方位角 yaw + 俯仰 pitch（0=水平看，π/2=顶视），正交投影（SVG y 向下）
      const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw);
      const cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
      const sx = x * cy - y * sy;
      const syUp = z * cp - x * sy * sp - y * cy * sp;   // 屏幕竖直分量（向上为正）
      return [sx, -syUp];
    },
    fit(points, pad = 30) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const [px, py] of points) {
        minX = Math.min(minX, px); maxX = Math.max(maxX, px);
        minY = Math.min(minY, py); maxY = Math.max(maxY, py);
      }
      const w = maxX - minX, h = maxY - minY;
      const k = Math.min(
        (canvas.width - pad * 2) / (w || 1),
        (canvas.height - pad * 2) / (h || 1)
      ) * st.scale;
      return { s: k, ox: (canvas.width - (maxX + minX) * k) / 2 + st.panX, oy: (canvas.height - (maxY + minY) * k) / 2 + st.panY };
    },
    draw() { if (handle.onDraw) handle.onDraw(); },
  };
  canvas.addEventListener("mousedown", (e) => {
    dragging = true; panning = (e.button === 2 || e.shiftKey);
    lastX = e.clientX; lastY = e.clientY;
    e.preventDefault();
  });
  window.addEventListener("mouseup", () => { dragging = false; panning = false; });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (panning) {
      st.panX += dx; st.panY += dy;
    } else {
      st.yaw += dx * 0.01;
      st.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, st.pitch + dy * 0.01));
    }
    handle.draw();
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    st.scale *= e.deltaY < 0 ? 1.12 : 0.89;
    st.scale = Math.max(0.2, Math.min(8, st.scale));
    handle.draw();
  }, { passive: false });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  return handle;
}

function resizeCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    cv.width = Math.round(rect.width * dpr);
    cv.height = Math.round(rect.height * dpr);
  }
}


// ---------- TAB 切换 ----------
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-body").forEach((b) => b.classList.toggle("active", b.id === btn.dataset.tab));
    if (btn.dataset.tab === "tab-wire") { resizeCanvas($("wire-canvas")); wireOrbit.draw(); }
    if (btn.dataset.tab === "tab-pc") { resizeCanvas($("pointcloud-canvas")); pcOrbit.draw(); }
  };
});

// ---------- 线架实时 3D ----------
let wireSegments = [];   // [{x1,y1,z1,x2,y2,z2,color}]
let stlParts = [];       // STL 部件 [{path,name,faces,edges,active}]
const wireOrbit = makeOrbit($("wire-canvas"));
const wireViewBtns = document.querySelectorAll("#tab-wire .view-btn");

wireOrbit.onDraw = function drawWire() {
  const cv = $("wire-canvas"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!currentModel) return;

  const pts2d = [];
  const projected = wireSegments.map((s) => {
    const a = wireOrbit.project(s.x1, s.y1, s.z1);
    const b = wireOrbit.project(s.x2, s.y2, s.z2);
    pts2d.push(a, b);
    return { a, b, color: s.color };
  });
  const hasStl = stlParts.some((p) => p.edges.length);
  if (!projected.length && !hasStl) return;

  // STL 部件投影（按高亮状态分样式）
  const stlDraw = [];
  for (const part of stlParts) {
    for (const s of part.edges) {
      const a = wireOrbit.project(s.x1, s.y1, s.z1);
      const b = wireOrbit.project(s.x2, s.y2, s.z2);
      pts2d.push(a, b);
      stlDraw.push({ a, b, part });
    }
  }

 const { s: k, ox, oy } = wireOrbit.fit(pts2d);

 // 地面网格（z=0 平面，范围随模型）
  let half = 100;
  let zMin = Infinity;
  for (const seg of wireSegments) {
    half = Math.max(half, Math.abs(seg.x1), Math.abs(seg.y1), Math.abs(seg.x2), Math.abs(seg.y2));
    if (seg.z1 < zMin) zMin = seg.z1;
    if (seg.z2 < zMin) zMin = seg.z2;
  }
  for (const part of stlParts) {
    for (const s of part.edges) {
      half = Math.max(half, Math.abs(s.x1), Math.abs(s.y1), Math.abs(s.x2), Math.abs(s.y2));
      if (s.z1 < zMin) zMin = s.z1;
      if (s.z2 < zMin) zMin = s.z2;
    }
  }
  half = (half || 100) * 1.25;
  const gridZ = zMin !== Infinity ? zMin : 0;
  drawGrid(ctx, wireOrbit, half, half / 5, ox, oy, k, gridZ);

  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.9;
  for (const seg of projected) {
    ctx.strokeStyle = seg.color;
    ctx.beginPath();
    ctx.moveTo(ox + seg.a[0] * k, oy + seg.a[1] * k);
    ctx.lineTo(ox + seg.b[0] * k, oy + seg.b[1] * k);
    ctx.stroke();
  }
  // STL 部件：有高亮时其余变暗，高亮件亮黄加粗
  const anyActive = stlParts.some((p) => p.active);
  for (const seg of stlDraw) {
    if (anyActive) {
      if (!seg.part.active) {
        ctx.strokeStyle = "rgba(110,220,220,0.10)";
        ctx.lineWidth = 1;
      } else {
        ctx.strokeStyle = "#ffd54a";
        ctx.lineWidth = 1.6;
      }
    } else {
      ctx.strokeStyle = "rgba(110,220,220,0.45)";
      ctx.lineWidth = 1;
    }
    ctx.beginPath();
    ctx.moveTo(ox + seg.a[0] * k, oy + seg.a[1] * k);
    ctx.lineTo(ox + seg.b[0] * k, oy + seg.b[1] * k);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  ctx.fillStyle = "#8aa";
  ctx.font = "11px sans-serif";
  ctx.fillText(`${wireSegments.length} edges${stlParts.length ? " + STL×" + stlParts.length : ""} · yaw ${Math.round(wireOrbit.state.yaw * 180 / Math.PI)}° pitch ${Math.round(wireOrbit.state.pitch * 180 / Math.PI)}°`, 10, cv.height - 10);
  drawAxesIndicator(ctx, wireOrbit, cv);
};

function primToSegments(prim) {
  const color = prim.color || "#9db4d0";
  const [px, py, pz] = prim.position || [0, 0, 0];
  const segs = [];
  const P = prim.params || {};
  const f = (v, d) => { const n = parseFloat(v); return isNaN(n) ? d : n; };
  if (prim.type === "line") {
    const a = P.start || [0, 0, 0], b = P.end || [0, 0, 0];
    segs.push({ x1: a[0] + px, y1: a[1] + py, z1: a[2] + pz, x2: b[0] + px, y2: b[1] + py, z2: b[2] + pz, color });
    return segs;
  }
  // 其余图元画包围盒 12 条棱
  let ex = 50, ey = 50, ez = 50;
  if (prim.type === "box") {
    ex = f(P.width, 100) / 2; ey = f(P.depth, 100) / 2; ez = f(P.height, 100) / 2;
  } else if (prim.type === "cylinder" || prim.type === "cone") {
    ex = ey = f(P.radius, 50); ez = f(P.height, 200) / 2;
  } else if (prim.type === "sphere") {
    ex = ey = ez = f(P.radius, 50);
  } else if (prim.type === "torus") {
    ex = ey = ez = f(P.major_radius, 80) + f(P.minor_radius, 20);
  }
  const c = [
    [px - ex, py - ey, pz - ez], [px + ex, py - ey, pz - ez],
    [px + ex, py + ey, pz - ez], [px - ex, py + ey, pz - ez],
    [px - ex, py - ey, pz + ez], [px + ex, py - ey, pz + ez],
    [px + ex, py + ey, pz + ez], [px - ex, py + ey, pz + ez],
  ];
  const E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  for (const [i, j] of E) {
    segs.push({ x1: c[i][0], y1: c[i][1], z1: c[i][2], x2: c[j][0], y2: c[j][1], z2: c[j][2], color });
  }
  return segs;
}

function loadWireModel(model) {
  wireSegments = [];
  stlParts = [];
  for (const prim of (model.geometry.primitives || [])) {
    wireSegments.push(...primToSegments(prim));
  }
  resizeCanvas($("wire-canvas"));
  wireOrbit.reset();
  wireOrbit.draw();
}

// ---------- STL 部件：自动加载全部 + 左侧清单点击高亮 ----------
function applyTransform(v, m) {
  if (!m || m.length !== 16) return v;
  return [
    m[0] * v[0] + m[1] * v[1] + m[2] * v[2] + m[3],
    m[4] * v[0] + m[5] * v[1] + m[6] * v[2] + m[7],
    m[8] * v[0] + m[9] * v[1] + m[10] * v[2] + m[11],
  ];
}

async function loadStlParts(model) {
  stlParts = [];
  // 部件实例列表（path+transform+faces）来自解析期收集的 extra.stl_parts
  const instances = (model.extra && model.extra.stl_parts) || [];
  if (!instances.length) {
    renderInfoPanel(model);
    return;
  }
  toast(`正在加载 ${instances.length} 个 STL 部件…`);
  // 按唯一文件取原始三角面，多实例共享
  const rawByPath = {};
  await Promise.all([...new Set(instances.map((p) => p.path))].map(async (path) => {
    try {
      const url = `/api/models/${currentId}/stl/${path.split("/").map(encodeURIComponent).join("/")}`;
      rawByPath[path] = (await (await api(url)).json()).triangles;
    } catch (e) { rawByPath[path] = null; }
  }));

  const stepHint = 4000;
  stlParts = instances.map((inst, idx) => {
    const raw = rawByPath[inst.path];
    if (!raw) return null;
    const m = inst.transform || [];
    const step = Math.max(1, Math.ceil(raw.length / stepHint));
    const edges = [];
    for (let i = 0; i < raw.length; i += step) {
      const t = raw[i];
      // 三角面三边，顶点按实例矩阵变换
      const vs = t.map((v) => applyTransform(v, m));
      for (let e = 0; e < 3; e++) {
        const a = vs[e], b = vs[(e + 1) % 3];
        edges.push({ x1: a[0], y1: a[1], z1: a[2], x2: b[0], y2: b[1], z2: b[2] });
      }
    }
    return {
      path: inst.path,
      name: inst.path.split("/").pop() + (instances.filter((x) => x.path === inst.path).length > 1 ? `#${instances.filter((x) => x.path === inst.path).indexOf(inst) + 1}` : ""),
      faces: inst.faces,
      edges,
      active: false,
    };
  }).filter(Boolean);
  toast(`STL 部件已加载：${stlParts.length} 个`);
  renderInfoPanel(model);
  wireOrbit.draw();
}

function toggleStlPart(path) {
  const part = stlParts.find((p) => p.path === path);
  if (!part) return;
  part.active = !part.active;
  renderInfoPanel(currentModel);
  wireOrbit.draw();
}

// ---------- 场景辅助：地面网格 + 右上角轴向指示 ----------
function drawGrid(ctx, orbit, half, step, ox, oy, k, z = 0) {
  ctx.strokeStyle = "rgba(120,140,170,0.28)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let v = -half; v <= half + 1e-6; v += step) {
    const a = orbit.project(v, -half, z), b = orbit.project(v, half, z);
    ctx.moveTo(ox + a[0] * k, oy + a[1] * k);
    ctx.lineTo(ox + b[0] * k, oy + b[1] * k);
    const c = orbit.project(-half, v, z), d = orbit.project(half, v, z);
    ctx.moveTo(ox + c[0] * k, oy + c[1] * k);
    ctx.lineTo(ox + d[0] * k, oy + d[1] * k);
  }
  ctx.stroke();
  // Z 轴立杆
  ctx.strokeStyle = "rgba(150,170,200,0.5)";
  ctx.beginPath();
  const z0 = orbit.project(0, 0, z), z1 = orbit.project(0, 0, z + half);
  ctx.moveTo(ox + z0[0] * k, oy + z0[1] * k);
  ctx.lineTo(ox + z1[0] * k, oy + z1[1] * k);
  ctx.stroke();
}

function drawAxesIndicator(ctx, orbit, cv) {
  // 右上角实时轴向：单位轴向量经当前视角投影
  const cx = cv.width - 64, cy = 64, R = 40;
  const axes = [
    { v: [1, 0, 0], c: "#ff5d5d", label: "X" },
    { v: [0, 1, 0], c: "#7ddf7d", label: "Y" },
    { v: [0, 0, 1], c: "#6da8ff", label: "Z" },
  ];
  ctx.save();
  ctx.fillStyle = "rgba(16,20,28,0.55)";
  ctx.beginPath();
  ctx.arc(cx, cy, R + 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const { v, c, label } of axes) {
    const [px, py] = orbit.project(v[0], v[1], v[2]);
    ctx.strokeStyle = c;
    ctx.fillStyle = c;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + px * R, cy + py * R);
    ctx.stroke();
    ctx.fillText(label, cx + px * (R + 8), cy + py * (R + 8));
  }
  // 原点
  ctx.fillStyle = "#ccc";
  ctx.beginPath();
  ctx.arc(cx, cy, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}


// ---------- 点云三维 ----------
let pcData = null;
const pointcloudState = { status: "idle", requestSeq: 0 };
const pcOrbit = makeOrbit($("pointcloud-canvas"));

pcOrbit.onDraw = function drawPointcloud() {
  const cv = $("pointcloud-canvas"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!pcData) return;
  if (!pcData.count) {
    ctx.fillStyle = "#889";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("模型没有可采样几何", cv.width / 2, cv.height / 2);
    return;
  }

  const projected = pcData.points.map(([x, y, z]) => pcOrbit.project(x, y, z));
  const { s: k, ox, oy } = pcOrbit.fit(projected);

  // 地面网格：以点云 x/y 水平范围与场景 z 中心为基准（不把 z 高度当横向半径）
  let half = 100;
  let zMin = Infinity;
  for (const [x, y, z] of pcData.points) {
    half = Math.max(half, Math.abs(x), Math.abs(y));
    if (z < zMin) zMin = z;
  }
  half = (half || 100) * 1.25;
  const pcGridZ = zMin !== Infinity ? zMin : 0;
  drawGrid(ctx, pcOrbit, half, half / 5, ox, oy, k, pcGridZ);

  const palette = {};
  for (const label of new Set(pcData.labels)) {
    let h = 0;
    for (const c of label) h = (h * 31 + c.codePointAt(0)) % 360;
    palette[label] = `hsl(${h},70%,60%)`;
  }
  ctx.font = "12px sans-serif";
  let lx = 10;
  for (const [label, color] of Object.entries(palette)) {
    ctx.fillStyle = color;
    ctx.fillRect(lx, 8, 8, 8);
    ctx.fillText(label, lx + 11, 16);
    lx += 22 + ctx.measureText(label).width;
  }
  ctx.fillStyle = "#888";
  ctx.fillText(`${pcData.count} pts · yaw ${Math.round(pcOrbit.state.yaw * 180 / Math.PI)}° pitch ${Math.round(pcOrbit.state.pitch * 180 / Math.PI)}°`, 10, cv.height - 10);
  drawAxesIndicator(ctx, pcOrbit, cv);

  const size = pcData.count > 5000 ? 1.5 : 2.5;
  for (let i = 0; i < pcData.count; i++) {
    const [px, py] = projected[i];
    ctx.fillStyle = palette[pcData.labels[i]] || "#fff";
    ctx.fillRect(ox + px * k - size / 2, oy + py * k - size / 2, size, size);
  }
};

function clearPointcloud() {
  pcData = null;
  pointcloudState.requestSeq++;   // 丢弃旧模型未完成的请求
  pointcloudState.status = "idle";
  $("btn-pointcloud").disabled = false;
  $("btn-pointcloud").textContent = "采样";
  const cv = $("pointcloud-canvas");
  cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
}

$("btn-pointcloud").onclick = async () => {
  if (pointcloudState.status === "loading") return;
  const seq = ++pointcloudState.requestSeq;
  pointcloudState.status = "loading";
  $("btn-pointcloud").disabled = true;
  $("btn-pointcloud").textContent = "采样中…";
  try {
    const params = new URLSearchParams({ seed: "42" });
    params.set("count", $("pc-count").value || "10000");
    const data = await (await api(`/api/models/${currentId}/pointcloud?${params.toString()}`)).json();
    if (seq !== pointcloudState.requestSeq) return;  // 已切换模型，丢弃
    pcData = data;
    resizeCanvas($("pointcloud-canvas"));
    pcOrbit.reset();
    pcOrbit.draw();
    toast(data.count ? `已采样 ${data.count} 点` : "模型没有可采样几何");
  } catch (e) {
    if (seq === pointcloudState.requestSeq) toast("失败：" + e.message);
  } finally {
    if (seq === pointcloudState.requestSeq) {
      pointcloudState.status = "idle";
      $("btn-pointcloud").disabled = false;
      $("btn-pointcloud").textContent = "采样";
    }
  }
};

// ---------- 列表（分页） ----------
const PAGE_SIZE = 100;
let currentPage = 1;
let totalPages = 1;

async function refreshList(page) {
  if (page !== undefined) currentPage = page;
  const params = new URLSearchParams();
  if ($("search").value.trim()) params.set("keyword", $("search").value.trim());
  for (const c of (ddDomain.value || [])) params.append("category", c);
  for (const s of (ddEtype.value || [])) params.append("subcategory", s);
  if (ddVoltage.value) params.set("voltage_level", ddVoltage.value);
  params.set("offset", (currentPage - 1) * PAGE_SIZE);
  params.set("limit", PAGE_SIZE);

  const resp = await api("/api/models?" + params.toString());
  const total = parseInt(resp.headers.get("X-Total-Count") || "0", 10);
  totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) { currentPage = totalPages; return refreshList(currentPage); }
  const models = await resp.json();

  const ul = $("model-list");
  ul.innerHTML = "";
  for (const m of models) {
    const li = document.createElement("li");
    li.dataset.id = m.id;
    if (m.id === currentId) li.classList.add("active");
    li.innerHTML =
      `<span>${escapeHtml(m.name)}</span>${sourceBadge(m)}<span class="m-code">${escapeHtml(m.code)}</span>` +
      `<div class="m-code">［${escapeHtml(m.category || "未分类")}${m.subcategory ? " / " + escapeHtml(m.subcategory) : ""}］</div>`;
    li.onclick = () => selectModel(m.id);
    ul.appendChild(li);
  }
  $("list-count").textContent = `共 ${total} 个模型`;
  $("pg-info").textContent = `${currentPage}/${totalPages}`;
  $("pg-prev").disabled = currentPage <= 1;
  $("pg-next").disabled = currentPage >= totalPages;
}

$("pg-prev").onclick = () => refreshList(currentPage - 1);
$("pg-next").onclick = () => refreshList(currentPage + 1);

async function refreshVersions() {

// ---------- 导入遮罩 ----------
let importTimer = null;
function showImportLoading(text) {
  $("import-mask").classList.add("show");
  $("load-text").textContent = text || "正在导入模型包…";
  const t0 = Date.now();
  $("load-sub").textContent = "已耗时 0 秒";
  clearInterval(importTimer);
  importTimer = setInterval(() => {
    $("load-sub").textContent = `已耗时 ${Math.round((Date.now() - t0) / 1000)} 秒（工程大包约需 1-5 分钟）`;
  }, 1000);
}
function hideImportLoading() {
  $("import-mask").classList.remove("show");
  clearInterval(importTimer);
}

function uploadWithProgress(form, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/models/import");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (err) { reject(err); }
      } else {
        let detail = xhr.statusText;
        try { detail = JSON.parse(xhr.responseText).detail || detail; } catch (e) { /* 忽略 */ }
        reject(new Error(detail));
      }
    };
    xhr.onerror = () => reject(new Error("网络错误"));
    xhr.send(form);
  });
}

$("btn-import").onclick = () => $("import-file").click();
$("import-file").onchange = async () => {
  const file = $("import-file").files[0];
  if (!file) return;
  const big = file.size > 1024 * 1024;
  showImportLoading("正在上传模型包…");
  $("btn-import").disabled = true;
  try {
    const form = new FormData();
    form.append("file", file);
    const result = await uploadWithProgress(form, (p) => {
      $("load-text").textContent = `正在上传模型包 ${Math.round(p * 100)}%`;
    });
    showImportLoading("服务端解析中（解包 / 装配 / 落库）…");
    toast(`导入成功：${result.created.length} 个模型`);
    currentId = result.created[0]?.id || null;
    await refreshList();
    if (currentId) await selectModel(currentId);
  } catch (e) {
    toast("导入失败：" + e.message);
  }
  hideImportLoading();
  $("btn-import").disabled = false;
  $("import-file").value = "";
};

// ---------- 分类管理（电力领域 × 设备类型，下拉面板内嵌添加/删除） ----------
let catTree = [];
let equipmentTypes = [];
let voltageOptions = [];

function makeTypeDropdown(containerId, opts) {
  const root = $(containerId);
  root.classList.add("dd");
  root.innerHTML = '<div class="dd-trigger" role="button" aria-haspopup="listbox" aria-expanded="false"><span></span></div><div class="dd-panel" role="listbox"></div>';
  const trigger = root.querySelector(".dd-trigger");
  const triggerText = root.querySelector(".dd-trigger span");
  const panel = root.querySelector(".dd-panel");
  const mode = opts.mode || "single";
  let values = mode === "multiple" ? [] : "";

  function selectedList() { return mode === "multiple" ? values : (values ? [values] : []); }
  function isSelected(v) { return mode === "multiple" ? values.includes(v) : values === v; }
  function triggerLabel() {
    const sel = selectedList();
    if (!sel.length) return "✅" + opts.allLabel;
    if (mode === "multiple" && sel.length > 1) return `✅已选 ${sel.length} 项`;
    return "✅" + sel[0];
  }

  function render() {
    const options = opts.getOptions();
    // “全部”状态（未选择任何项）下所有选项显示为已选勾选态
    const all = !selectedList().length;
    panel.innerHTML =
      options.map((o) =>
        `<div class="dd-opt${all || isSelected(o) ? " active" : ""}" data-v="${escapeHtml(o)}" role="option" aria-selected="${all || isSelected(o)}">` +
        `<span class="dd-check">${all || isSelected(o) ? "✓" : ""}</span><span class="dd-label">${escapeHtml(o)}</span></div>`
      ).join("") +
      (opts.onAdd || opts.onDelete
        ? '<div class="dd-actions">' +
          (opts.onAdd ? '<button class="dd-add">＋ 添加…</button>' : "") +
          (opts.onDelete ? `<button class="dd-del"${selectedList().length ? "" : " disabled"}>✕ 删除选中</button>` : "") +
          "</div>"
        : "");
    panel.querySelectorAll(".dd-opt").forEach((el) => {
      el.onclick = () => {
        const v = el.dataset.v;
        if (mode === "multiple") {
          values = values.includes(v) ? values.filter((x) => x !== v) : [...values, v];
        } else {
          values = values === v ? "" : v;
        }
        close(); render(); if (opts.onChange) opts.onChange();
      };
    });
    const addBtn = panel.querySelector(".dd-add");
    if (addBtn) addBtn.onclick = (e) => { e.stopPropagation(); opts.onAdd(); };
    const delBtn = panel.querySelector(".dd-del");
    if (delBtn) delBtn.onclick = (e) => {
      e.stopPropagation();
      if (opts.onDelete) selectedList().forEach((v) => opts.onDelete(v));
    };
    triggerText.textContent = triggerLabel();
    trigger.setAttribute("aria-expanded", root.classList.contains("open") ? "true" : "false");
  }
  function close() { root.classList.remove("open"); trigger.setAttribute("aria-expanded", "false"); }
  trigger.onclick = () => {
    root.classList.toggle("open");
    trigger.setAttribute("aria-expanded", root.classList.contains("open") ? "true" : "false");
    document.querySelectorAll(".dd.open").forEach((d) => { if (d !== root) d.classList.remove("open"); });
    render();
  };
  document.addEventListener("click", (e) => { if (!root.contains(e.target)) close(); });
  return {
    render,
    get value() { return values; },
    set(v) { values = v; render(); },
    clear() { values = mode === "multiple" ? [] : ""; render(); },
  };
}

const ddDomain = makeTypeDropdown("dd-domain", {
  mode: "multiple",
  allLabel: "全部大类",
  getOptions: () => catTree,
  onChange: () => refreshList(1),
  onAdd: () => addType("domain"),
  onDelete: (v) => deleteType("domain", v),
});

const ddEtype = makeTypeDropdown("dd-etype", {
  mode: "multiple",
  allLabel: "全部设备类型",
  getOptions: () => equipmentTypes,
  onChange: () => refreshList(1),
  onAdd: () => addType("etype"),
  onDelete: (v) => deleteType("etype", v),
});

const ddVoltage = makeTypeDropdown("dd-voltage", {
  mode: "single",
  allLabel: "全部电压等级",
  getOptions: () => voltageOptions,
  onChange: () => refreshList(1),
});

async function refreshCategories() {
  catTree = await (await api("/api/categories")).json();
  equipmentTypes = await (await api("/api/equipment-types")).json();
  // 当前选中值若已被删除则回退到「全部」
  if ((ddDomain.value || []).some((v) => !catTree.includes(v))) ddDomain.clear();
  if ((ddEtype.value || []).some((v) => !equipmentTypes.includes(v))) ddEtype.clear();
  ddDomain.render();
  ddEtype.render();
  $("n-category").innerHTML = catTree.map((n) => `<option>${escapeHtml(n)}</option>`).join("");
  return catTree;
}

async function loadFilterOptions() {
  const data = await (await api("/api/filter-options")).json();
  voltageOptions = data.voltage_levels || [];
  // 保留当前模型不在预置列表内的电压值
  if (currentModel && currentModel.voltage_level && !voltageOptions.includes(currentModel.voltage_level)) {
    voltageOptions = [...voltageOptions, currentModel.voltage_level];
  }
  ddVoltage.render();
}

// 添加/删除类型（kind: domain / etype）
async function addType(kind) {
  const label = kind === "domain" ? "电力领域" : "设备类型";
  const name = prompt(`新增${label}名称：`);
  if (!name || !name.trim()) return;
  try {
    const url = kind === "domain" ? "/api/categories" : "/api/equipment-types";
    await api(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.trim() }),
    });
    toast(`已添加${label}：${name.trim()}`);
    await refreshCategories();
    // 自动选中新项并筛选
    const dd = kind === "domain" ? ddDomain : ddEtype;
    if (dd.value && dd.value.includes) dd.set([...dd.value, name.trim()]);
    else dd.set(name.trim());
    await refreshList(1);
  } catch (e) { toast("失败：" + e.message); }
}

async function deleteType(kind, name) {
  const label = kind === "domain" ? "电力领域" : "设备类型";
  if (!name) return;
  if (!confirm(`删除${label}「${name}」？使用中的模型将被置为未分类。`)) return;
  try {
    const url = kind === "domain"
      ? "/api/categories/" + encodeURIComponent(name)
      : "/api/equipment-types/" + encodeURIComponent(name);
    await api(url, { method: "DELETE" });
    toast(`已删除${label}：${name}`);
    await refreshCategories();
    await refreshList(1);
  } catch (e) { toast("失败：" + e.message); }
}

async function renderCatList() {
  await refreshCategories();
  $("cat-list").innerHTML = catTree.map((n) =>
    `<li>▸ ${escapeHtml(n)} <button class="danger cat-del" data-name="${escapeHtml(n)}" style="float:right;padding:0 6px;font-size:10px">删</button></li>`
  ).join("");
  $("et-list").innerHTML = equipmentTypes.map((n) =>
    `<li>▸ ${escapeHtml(n)} <button class="danger et-del" data-name="${escapeHtml(n)}" style="float:right;padding:0 6px;font-size:10px">删</button></li>`
  ).join("");
  $("cat-list").querySelectorAll(".cat-del").forEach((el) => {
    el.onclick = async () => {
      const name = el.dataset.name;
      if (!confirm(`删除领域「${name}」？使用该领域的模型将被置为未分类。`)) return;
      try {
        await api("/api/categories/" + encodeURIComponent(name), { method: "DELETE" });
        await renderCatList();
        await refreshList(1);
      } catch (e) { toast("失败：" + e.message); }
    };
  });
  $("et-list").querySelectorAll(".et-del").forEach((el) => {
    el.onclick = async () => {
      const name = el.dataset.name;
      if (!confirm(`删除设备类型「${name}」？使用该类型的模型将被置为未分类。`)) return;
      try {
        await api("/api/equipment-types/" + encodeURIComponent(name), { method: "DELETE" });
        await renderCatList();
        await refreshList(1);
      } catch (e) { toast("失败：" + e.message); }
    };
  });
}
